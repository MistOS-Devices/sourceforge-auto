name: Gofile to SourceForge

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: "Gofile share/download URL"
        required: true
        type: string

      device:
        description: "Device name (example: raphael, bluejay, lisa, sweet, raven)"
        required: true
        type: string

      extra_gofile_url:
        description: "OPTIONAL: Gofile URL for an extra file (IMG, ZIP, recovery image, etc.)"
        required: false
        type: string
        default: ""

      extra_folder:
        description: "OPTIONAL: Subfolder under the device folder (example: IMG-5.1). Leave empty to upload to the device root."
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  SOURCEFORGE_HOST: frs.sourceforge.net
  SOURCEFORGE_BASE: /home/frs/project/project-mistos/Android17

  GOFILE_USER_AGENT: "MistOS-Gofile-Uploader/1.0"
  GOFILE_LANGUAGE: "en-US"

jobs:
  upload:
    name: Download Gofile → Upload SourceForge
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            openssh-client \
            rsync \
            file \
            nodejs

          echo
          echo "=============================================="
          echo "DEPENDENCIES"
          echo "=============================================="

          curl --version | head -n 1
          jq --version
          node --version
          rsync --version | head -n 1
          sftp -V 2>&1 | head -n 1 || true


      # ============================================================
      # PREPARE WORKSPACE
      # ============================================================

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="$RUNNER_TEMP/mistos-gofile"

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
